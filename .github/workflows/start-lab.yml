name: Start lab
on:
  workflow_dispatch:
    inputs:
      create_starter_prs:
        description: Create starter pull requests
        type: boolean
        required: true
        default: false
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read
  security-events: read
concurrency:
  group: bsp-beginner-setup
  cancel-in-progress: false
jobs:
  setup:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .workshop
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - name: Recreate work items in this copy
        run: node .workshop/workflow.cjs setup
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_STARTER_PRS: ${{ inputs.create_starter_prs }}
