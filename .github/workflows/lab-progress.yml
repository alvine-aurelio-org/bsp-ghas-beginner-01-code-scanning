name: Lab progress
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Quality, Security regression, CodeQL, Dependency review]
    types: [completed]
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
  checks: read
  security-events: read
concurrency:
  group: bsp-beginner-management
  cancel-in-progress: false
jobs:
  status:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.id == github.repository_id)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .workshop
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - name: Read native metadata and refresh the Exercise issue
        run: node .workshop/cli.cjs status
        env:
          GH_TOKEN: ${{ github.token }}
